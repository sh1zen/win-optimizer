name: Build Windows installer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (YY.MM.DD); leave empty to use the build date'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Build, test and package Windows x64
    # This image includes VS 2026/MSBuild 18, desktop workloads and Inno Setup 6.
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Check versioning, packaging and installer behavior
        run: |
          ./tests/versioning.tests.ps1
          ./tests/packaging.tests.ps1
          ./tests/installer.tests.ps1

      - name: Build application, run tests and create installer
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          $packageArguments = @{ SkipSigning = $true }
          if ($env:PACKAGE_VERSION) {
            $packageArguments.Version = $env:PACKAGE_VERSION
          }
          ./extras/build-and-package.ps1 @packageArguments
          if ($LASTEXITCODE -ne 0) {
            throw "Packaging failed with exit code $LASTEXITCODE."
          }

      - name: Verify installer and application versions, payload and languages
        run: ./tests/packaged-payload.tests.ps1

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: win-optimizer-windows-x64-${{ github.run_number }}-${{ github.run_attempt }}
          path: build/installers/win-optimizer.Installer.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload test results and build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: win-optimizer-validation-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            build/test-results/**/*.trx
            build/logs/**
          if-no-files-found: warn
          retention-days: 14
