name: Build Windows installer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (YY.MM.DD); leave empty to use the build date'
        required: false
        type: string
  workflow_call:
    outputs:
      version:
        description: 'Validated package version (YY.MM.DD)'
        value: ${{ jobs.installer.outputs.version }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Build, test and package Windows x64
    # This image includes VS 2026/MSBuild 18, desktop workloads and Inno Setup 6.
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Resolve package version
        id: version
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          # A tag supplies the release date; MSBuild owns date validation and defaults.
          $version = $env:PACKAGE_VERSION
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -cnotmatch '^v[0-9]{2}\.[0-9]{2}\.[0-9]{2}$') {
              throw 'Release tags must use vYY.MM.DD.'
            }
            $version = $env:GITHUB_REF_NAME.Substring(1)
          }
          $msbuild = ./extras/Resolve-MSBuild.ps1
          $arguments = @('Version.props', '-target:ValidateWinOptimizerVersion',
            '-getProperty:WinOptimizerVersion', '-verbosity:quiet', '-nologo')
          if ($version) { $arguments += "-property:WinOptimizerVersion=$version" }
          $resolved = & $msbuild @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Package version resolution failed.' }
          "version=$(($resolved -join '').Trim())" >> $env:GITHUB_OUTPUT

      - name: Check versioning, packaging and installer behavior
        run: |
          ./tests/versioning.tests.ps1
          ./tests/workflows.tests.ps1
          ./tests/test-runner.tests.ps1
          ./tests/packaging.tests.ps1
          ./tests/installer.tests.ps1

      - name: Build application, run tests and create installer
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./extras/build-and-package.ps1 -SkipSigning -Version $env:PACKAGE_VERSION
          if ($LASTEXITCODE -ne 0) {
            throw "Packaging failed with exit code $LASTEXITCODE."
          }

      - name: Verify installer and application versions, payload and languages
        run: ./tests/packaged-payload.tests.ps1

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: win-optimizer-windows-x64-v${{ steps.version.outputs.version }}
          path: build/installers/win-optimizer.Installer.exe
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 30

      - name: Upload test results and build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: win-optimizer-validation-v${{ steps.version.outputs.version || 'unresolved' }}
          path: |
            build/test-results/**/*.trx
            build/logs/**
          if-no-files-found: warn
          overwrite: true
          retention-days: 14
